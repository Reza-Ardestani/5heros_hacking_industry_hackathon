[project]
name = "bottleneck-busters-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "eclipse-sumo==1.27.1",
    "lightgbm>=4.7.0",
    "mcp>=1.20,<2",
    "anthropic>=1.11,<2",
    "psycopg[binary]>=3.2,<4",
    "tzdata>=2025.2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9"]
mcp = []  # kept so existing "--group mcp" commands still work; mcp is now a main dependency
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
